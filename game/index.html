<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Harbor</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07080f; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .noise { position: fixed; inset: 0; pointer-events: none; opacity: .05; background-image: repeating-linear-gradient(0deg, #fff 0 1px, transparent 1px 3px); mix-blend-mode: overlay; }
</style>
</head>
<body>
<canvas id="game" aria-label="Neon Harbor, an open-world crime game: explore the city on foot and by car, evade the police, and finish the story."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div class="noise"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
